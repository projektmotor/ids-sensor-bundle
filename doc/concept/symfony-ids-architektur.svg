<svg width="680" height="640" viewBox="0 0 680 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Datenfluss und Regelklassen des Symfony-IDS</title>
<desc>Drei Sensoren senden normalisierte Events über die REST-Schnittstelle des Collectors an den Consumer, der sie in PostgreSQL schreibt. Echtzeitregeln laufen im Consumer, Batch-, Korrelations- und Positivpfadregeln im Detection Job. Alle Regeln schreiben in die Alerts-Tabelle.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="640" fill="#FFFFFF"/>

<g>
<rect x="40" y="40" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="130" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Kernel-Ebene</text>
<text x="130" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">+ Normalisierer</text>
</g>

<g>
<rect x="240" y="40" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="330" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Security-Ebene</text>
<text x="330" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">+ Normalisierer</text>
</g>

<g>
<rect x="440" y="40" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="530" y="60" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">Business-Ebene</text>
<text x="530" y="78" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">+ Normalisierer</text>
</g>

<path d="M130 96 L130 116 L330 116" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<path d="M530 96 L530 116 L330 116" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>
<line x1="330" y1="116" x2="330" y2="128" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="190" y="130" width="280" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="330" y="152" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Collector-Ingest</text>
</g>

<path d="M330 174 L330 194 L180 194 L180 213" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="215" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="235" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Consumer</text>
<text x="180" y="253" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">schreibt, prüft in Echtzeit</text>
</g>

<line x1="180" y1="271" x2="180" y2="308" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="310" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="180" y="330" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">PostgreSQL</text>
<text x="180" y="348" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">events, events_raw</text>
</g>

<line x1="180" y1="366" x2="180" y2="403" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="405" width="280" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="180" y="425" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#444441">Detection Job</text>
<text x="180" y="443" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">periodisch, alle 1–5 Min.</text>
</g>

<rect x="358" y="196" width="282" height="322" rx="16" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="378" y="216" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Erkennungsregeln</text>

<line x1="320" y1="243" x2="376" y2="253" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="378" y="230" width="242" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="499" y="248" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Echtzeit: R1–R7</text>
<text x="499" y="266" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">im Consumer, PostgreSQL</text>
</g>

<path d="M320 425 L349 425 L349 325 L376 325" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 433 L340 433 L340 395 L376 395" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M320 441 L331 441 L331 465 L376 465" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="378" y="300" width="242" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="499" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Batch: B1–B7</text>
<text x="499" y="336" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">SQL-Aggregation</text>
</g>

<g>
<rect x="378" y="370" width="242" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="499" y="388" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Korrelation: X1–X4, B8, B9</text>
<text x="499" y="406" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">ebenenübergreifend</text>
</g>

<g>
<rect x="378" y="440" width="242" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="499" y="458" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">Positivpfad: P1–P3</text>
<text x="499" y="476" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Baseline-Vergleich</text>
</g>

<path d="M499 518 L499 556 L322 556" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="40" y="528" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="180" y="548" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#3C3489">alerts</text>
<text x="180" y="566" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#534AB7">Befunde aller Regelklassen</text>
</g>

<text x="40" y="612" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#5F5E5A">Teal = Erfassung, Grau = Transport und Ausführung, Violett = Daten und Befunde</text>
</svg>
