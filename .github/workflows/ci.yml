name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.deps }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          # Untere Grenze des Constraints ^6.4|^7.0. Der Abdruck des Containers
          # bleibt aussen vor: er bildet Symfonys eigene Dienste mit ab und die
          # unterscheiden sich zwischen den Zweigen — Begruendung im Docblock von
          # ContainerFingerprintTest.
          - php: '8.2'
            deps: lowest
            phpunit: '--exclude-group fingerprint'
          - php: '8.3'
            deps: highest
            phpunit: ''
          # Obere Grenze.
          - php: '8.4'
            deps: highest
            phpunit: ''

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json, mbstring, apcu
          # memory_limit gleichgezogen mit docker/php/php.ini. setup-php legt
          # php.ini-production zugrunde, und deren 128M reichen der Suite nicht: ein
          # Integrationslauf bootet gut zwei Dutzend Container-Varianten und steht am Ende
          # bei rund 150 MB. Das Limit riss den Lauf mit einem Fatal Error mitten aus der
          # Suite — kein Testfehler, sondern ein abgeschnittener Prozess.
          ini-values: apc.enable_cli=1, memory_limit=512M
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.deps }}

      - name: Unit- und Integrationstests
        env:
          SYMFONY_DEPRECATIONS_HELPER: 'max[direct]=0'
        run: vendor/bin/phpunit --testsuite unit,integration ${{ matrix.phpunit }}

  static:
    name: PHPStan und Coding Standards
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          # Eine kanonische Fassung genuegt. Statische Analyse ueber die ganze
          # Matrix zu fahren meldet Unterschiede zwischen den Symfony-Zweigen als
          # Fehler im eigenen Code — das waere Rauschen, keine Erkenntnis.
          php-version: '8.3'
          extensions: json, mbstring, apcu
          coverage: none

      - uses: ramsey/composer-install@v3

      - run: vendor/bin/phpstan analyse --no-progress

      - run: vendor/bin/php-cs-fixer fix --dry-run --diff

  packaging:
    name: Installierbarkeit ohne Dev-Abhaengigkeiten
    runs-on: ubuntu-latest

    # Diese Zusage kann kein Test der Suite pruefen: lokal sind die
    # Dev-Abhaengigkeiten immer da. Faellt `projektmotor/ids-event-data` je zurueck
    # nach require-dev, scheitert der Container hier — und nicht beim Konsumenten.
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: json, mbstring
          coverage: none

      - run: composer validate --strict

      - run: composer install --no-dev --no-interaction --no-progress

      - name: Kernel mit dem Bundle booten
        run: |
          cat > /tmp/boot.php <<'PHP'
          <?php

          declare(strict_types=1);

          require __DIR__.'/vendor/autoload.php';

          use ProjektMotor\IdsSensor\IdsSensorBundle;
          use Symfony\Bundle\FrameworkBundle\FrameworkBundle;
          use Symfony\Component\Config\Loader\LoaderInterface;
          use Symfony\Component\DependencyInjection\ContainerBuilder;
          use Symfony\Component\HttpKernel\Kernel;

          final class PackagingKernel extends Kernel
          {
              public function registerBundles(): iterable
              {
                  return [new FrameworkBundle(), new IdsSensorBundle()];
              }

              public function registerContainerConfiguration(LoaderInterface $loader): void
              {
                  $loader->load(static function (ContainerBuilder $container): void {
                      $container->loadFromExtension('framework', [
                          'secret' => 'ci',
                          'test' => false,
                          'http_method_override' => false,
                      ]);
                      $container->loadFromExtension('ids_sensor', [
                          'application_id' => 'ci-app',
                          'instance_id' => 'ci-1',
                          'environment' => 'prod',
                          'session_hash' => ['key' => str_repeat('a', 32)],
                      ]);
                  });
              }

              public function getCacheDir(): string
              {
                  return sys_get_temp_dir().'/packaging-cache';
              }

              public function getLogDir(): string
              {
                  return sys_get_temp_dir().'/packaging-log';
              }
          }

          (new PackagingKernel('prod', false))->boot();
          echo "Container kompiliert und gebootet\n";
          PHP
          cp /tmp/boot.php boot.php
          php boot.php

      - name: Dist-Archiv auf Fremdkoerper pruefen
        run: |
          git archive --format=tar HEAD > /tmp/dist.tar
          echo "--- Inhalt des Dist-Archivs ---"
          tar -tf /tmp/dist.tar
          # `doc/` steht bewusst NICHT in dieser Liste: es wird mit ausgeliefert, weil die
          # README elfmal dorthin verweist — Begründung in .gitattributes, durchgesetzt von
          # DocumentationTest::testNoLinkedDirectoryIsExcludedFromTheDistArchive().
          for unerwuenscht in tests/ docker/ Makefile CLAUDE.md phpunit.xml.dist; do
            if tar -tf /tmp/dist.tar | grep -q "^${unerwuenscht}"; then
              echo "FEHLER: ${unerwuenscht} wird mit ausgeliefert — export-ignore fehlt in .gitattributes"
              exit 1
            fi
          done
