memory_limit = 512M
error_reporting = E_ALL
display_errors = On

; APCu auch in der CLI aktiv halten. Wichtig: Das FPM- und das CLI-Segment sind
; getrennt — der Drain-/Heartbeat-Command sieht die Zähler des Webservers NICHT.
; Deshalb werden Zähler zusätzlich dateibasiert materialisiert (siehe CounterStore).
apc.enabled = 1
apc.enable_cli = 1
