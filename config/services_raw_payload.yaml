# Das raw-Feld: ob es mitreist (Gate) und was darin steht (Builder).
#
# Immer geladen. `raw.enabled: false` lässt das Feld ganz weg — das entscheidet das Gate
# über ein Konstruktorargument, nicht über den Dateiimport. Deshalb gibt es hier keine
# Abschaltgrenze, nach der zu schneiden wäre; geschnitten ist nach dem Thema.

services:
    _defaults:
        public: false
        autowire: false
        autoconfigure: true
        bind:
            $cleaner: '@ids_sensor.payload_confidentiality_cleanup.cleaner'

    ids_sensor.raw.gate:
        class: ProjektMotor\IdsSensor\Support\RawPayload\Gate
        arguments:
            $enabled: '%ids_sensor.raw.enabled%'
            $severities: '%ids_sensor.raw.severities%'
            # Die Ausnahmeliste zu Konzept 4.5.2 (offener Punkt OB11): Leer als Vorgabe,
            # also unveraendertes Verhalten. Sie ist die einzige Stelle, an der die
            # Stufengrenze aus Abschnitt 3 nach OBEN durchbrochen werden kann — und zwar
            # nur auf ausdrueckliche Anweisung des Betreibers.
            $alwaysEventTypes: '%ids_sensor.raw.always_for.event_types%'
            $alwaysPathPatterns: '%ids_sensor.raw.always_for.path_patterns%'

    ids_sensor.raw.builder:
        class: ProjektMotor\IdsSensor\Support\RawPayload\Builder
        arguments:
            $includeRequestBody: '%ids_sensor.raw.include_request_body%'
            $skipMultipart: '%ids_sensor.raw.skip_multipart%'
            $maxBytes: '%ids_sensor.raw.max_bytes%'
            # Geprueft am Content-Length VOR dem Lesen — das ist der Unterschied zwischen
            # "der Koerper ist begrenzt" und "wir lesen erst und messen dann". Konzept 3.5
            # erlaubt den Zugriff auf den Eingabestrom genau unter dieser Bedingung.
            $maxRequestBodyBytes: '%ids_sensor.raw.max_request_body_bytes%'
