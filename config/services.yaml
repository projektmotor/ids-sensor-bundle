# Verdrahtung des Sensor-Bundles.
#
# KEIN Autowiring, und das ist Absicht: Autowiring löst einen Typ auf eine Service-ID auf, und
# `public: false` verhindert das Injizieren nicht. Wären die IDs Klassennamen, könnte die
# überwachte Anwendung EventBuffer, Cleaner und EventFlusher in ihre Konstruktoren
# schreiben — die Innereien würden zur API, obwohl die README sie als @internal führt.
# Symfonys eigene Bundles gehen denselben Weg: Definitionen unter Zeichenketten, nur der
# öffentliche Vertrag als FQCN-Alias. Gegen Wiederholung hilft `bind`, es ordnet über den
# Argumentnamen zu und wirkt auch ohne Autowiring.

services:
    _defaults:
        public: false
        autowire: false
        autoconfigure: true
        bind:
            # NICHT '@?logger': Ein werfender Logger — voller Plattenplatz, weggebrochener
            # Syslog-Socket — entwiche sonst in die überwachte Anwendung, und an zwei
            # Stellen (FrameDispatcher-catch, FileSpool::append) übersprünge er dabei die
            # Rettung des Frames. Der Dekorator gilt einmal statt an 19 Aufrufstellen.
            $logger: '@ids_sensor.logger'

    # Trägt das Kanal-Tag stellvertretend für alle: Sie bekommen den Logger über ihn,
    # also entscheidet SEIN Kanal. IdsSensorBundle::applyLogChannel() setzt ihn.
    ids_sensor.logger:
        class: ProjektMotor\IdsSensor\Support\Telemetry\FailSafeLogger
        arguments:
            $inner: '@?logger'
        tags:
            - { name: monolog.logger, channel: ids_sensor }

    ids_sensor.instance_id_provider:
        class: ProjektMotor\IdsSensor\Support\Identity\InstanceIdProvider
        arguments:
            $configured: '%ids_sensor.instance_id%'

    ids_sensor.environment_resolver:
        class: ProjektMotor\IdsSensor\Support\Identity\EnvironmentResolver
        arguments:
            $configuredEnvironment: '%ids_sensor.environment%'
            $map: '%ids_sensor.environment_map%'
            $fallback: !service
                class: ProjektMotor\IdsEventData\Vocabulary\Environment
                factory: ['ProjektMotor\IdsEventData\Vocabulary\Environment', 'from']
                arguments: ['%ids_sensor.environment_fallback%']

    ids_sensor.identity_provider:
        class: ProjektMotor\IdsSensor\Support\Identity\SensorIdentityProvider
        arguments:
            $applicationId: '%ids_sensor.application_id%'
            $instanceIdProvider: '@ids_sensor.instance_id_provider'
            $environmentResolver: '@ids_sensor.environment_resolver'

    ids_sensor.event_id_generator:
        class: ProjektMotor\IdsSensor\Processing\Normalization\UuidV7EventIdGenerator

    ids_sensor.event_factory:
        class: ProjektMotor\IdsSensor\Processing\Normalization\EventFactory
        arguments:
            $idGenerator: '@ids_sensor.event_id_generator'
            $rawGate: '@ids_sensor.raw.gate'

    # kernel.reset kommt über ResetInterface (autoconfigure). reset() zählt dabei noch nicht
    # geleerte Events, statt sie still zu verlieren.
    ids_sensor.event_buffer:
        class: ProjektMotor\IdsSensor\Sensor\EventBuffer
        arguments:
            $maxEvents: '%ids_sensor.budget.max_events_per_request%'

    ids_sensor.capture_budget:
        class: ProjektMotor\IdsSensor\Sensor\CaptureBudget
        arguments:
            $limitMicroseconds: '%ids_sensor.budget.capture_us%'

    ids_sensor.latency_recorder:
        class: ProjektMotor\IdsSensor\Support\Telemetry\LatencyRecorder
        arguments:
            $enabled: '%ids_sensor.telemetry.latency_histogram%'

    # Monoton, mit Prozessschlüssel: bei at-least-once-Zustellung würden Delta-Zähler bei
    # einer erneuten Zustellung doppelt gezählt.
    ids_sensor.counters:
        class: ProjektMotor\IdsSensor\Support\Telemetry\Counters

    # Die Verlustzähler aus Phase A, eingesammelt beim Flush. Der Sensor-Verweis ist
    # optional: ohne Security-Ebene oder mit abgeschalteter Entscheidungserfassung gibt es
    # den Dienst nicht. Instanziiert wird hier erst nach dem Absenden der Antwort — die
    # Entscheidungskette der Anwendung wird dadurch nicht früher aufgebaut, als sie es
    # ohnehin würde.
    ids_sensor.deferred_counters:
        class: ProjektMotor\IdsSensor\Support\Telemetry\DeferredCounters
        arguments:
            $counters: '@ids_sensor.counters'
            $buffer: '@ids_sensor.event_buffer'
            $captureBudget: '@ids_sensor.capture_budget'
            $accessDecisionSensor: '@?ids_sensor.sensor.access_decision'
            $latencyRecorder: '@ids_sensor.latency_recorder'

    # Redigiert mit: ein `?token=…` landet in payload.query und damit — anders als raw — in
    # JEDEM Event, auch bei info. Konzept 4.5.1 nennt die Liste nur für raw; sie hier
    # auszulassen wäre die größere Lücke.
    ids_sensor.query_normalizer:
        class: ProjektMotor\IdsSensor\Processing\Normalization\QueryNormalizer
        arguments:
            $cleaner: '@ids_sensor.payload_confidentiality_cleanup.cleaner'

    ids_sensor.severity_resolver:
        class: ProjektMotor\IdsSensor\Processing\Normalization\SeverityResolver

    ids_sensor.http_status_resolver:
        class: ProjektMotor\IdsSensor\Sensor\Kernel\HttpStatusResolver

    # Der Tag bleibt AUSDRÜCKLICH und wird nicht über registerForAutoconfiguration vergeben.
    #
    # Das wäre möglich und würde drei Zeilen sparen — aber es hieße: wer
    # EventNormalizerInterface implementiert, hängt im Normalisierungspfad des Sensors. Die
    # überwachte Anwendung könnte damit eigene Normalisierer in den Beweispfad einspeisen,
    # indem sie ein als @internal markiertes Interface implementiert. Für einen
    # Sicherheitssensor ist das die falsche Richtung; die drei Zeilen sind der Preis dafür,
    # dass diese Kette geschlossen bleibt.
    ids_sensor.normalizer.kernel:
        class: ProjektMotor\IdsSensor\Processing\Normalization\KernelEventNormalizer
        arguments:
            $eventFactory: '@ids_sensor.event_factory'
            $severityResolver: '@ids_sensor.severity_resolver'
            $queryNormalizer: '@ids_sensor.query_normalizer'
            # Für die exception_message: sie trägt bei JEDER Stufe den angefragten Pfad
            # samt Query, und die Denylist aus Konzept 4.5.1 sah dieses Feld bis dahin nie.
            $cleaner: '@ids_sensor.payload_confidentiality_cleanup.cleaner'
        tags:
            - { name: ids_sensor.event_normalizer }

    # Vorgabe ohne DSN: so ist das Erfassungsbudget messbar, bevor ein Broker existiert.
    # services_transport.yaml ersetzt ihn.
    ids_sensor.shipper:
        class: ProjektMotor\IdsSensor\Delivery\Transport\Shipper\NullShipper

    # $sapi wird NICHT gesetzt: der Konstruktor-Default ist \PHP_SAPI und wird zur LAUFZEIT
    # ausgewertet. Über die Verdrahtung übergeben (etwa als !php/const) fröre der Wert beim
    # Kompilieren ein — in einem gewärmten Container-Image also die SAPI der Build-Umgebung
    # (cli) und damit für jede Web-Anfrage falsch.
    ids_sensor.runtime_profile:
        class: ProjektMotor\IdsSensor\Delivery\Transport\RuntimeProfile
        arguments:
            $policy: '%ids_sensor.flush.policy%'
            $drainIntervalSeconds: '%ids_sensor.spool.drain_interval_s%'

    # Bekommt die vollständige aufgelöste Konfiguration, weil sie über Dinge urteilt, die im
    # Betrieb bewusst KEINEN Fehler erzeugen — fail-open macht Fehlkonfiguration unsichtbar,
    # und genau das hebt dieser Command auf.
    ids_sensor.command.setup_check:
        class: ProjektMotor\IdsSensor\Command\SetupCheckCommand
        arguments:
            $identityProvider: '@ids_sensor.identity_provider'
            $environmentResolver: '@ids_sensor.environment_resolver'
            $runtime: '@ids_sensor.runtime_profile'
            $config: '%ids_sensor.config%'
            $spool: '@ids_sensor.spool'
            $heartbeatScheduler: '@?ids_sensor.heartbeat.scheduler'

    # Volumen-Stellrad aus Konzept 4.2.3. Bei der Vorgabe 1.0 wird nicht einmal gezogen.
    ids_sensor.sampler:
        class: ProjektMotor\IdsSensor\Delivery\Dispatch\CoherentInfoSampler
        arguments:
            $infoRate: '%ids_sensor.sampling.info_rate%'
            $keepIfRequestRelevant: '%ids_sensor.sampling.keep_if_request_relevant%'

    # Entscheidet über Broker oder Spool. Bewusst NICHT lazy und ohne Arbeit im
    # Konstruktor: der Dienst wird vom FlushListener in kernel.terminate angefordert,
    # also außerhalb des try/catch im Flusher. Eine Exception beim Bauen entstünde
    # unmittelbar in der überwachten Anwendung — genau der Fall, den Konzept 4.
    # ausschließt. Aus demselben Grund ist der Redis-Transport `lazy: true`.
    ids_sensor.frame_dispatcher:
        class: ProjektMotor\IdsSensor\Delivery\Dispatch\FrameDispatcher
        arguments:
            $shipper: '@ids_sensor.shipper'
            $counters: '@ids_sensor.counters'
            $runtime: '@ids_sensor.runtime_profile'
            $spool: '@ids_sensor.spool'
            $maxFrameBytes: '%ids_sensor.flush.max_frame_bytes%'
            $breaker: '@ids_sensor.circuit_breaker'

    ids_sensor.event_flusher:
        class: ProjektMotor\IdsSensor\Delivery\Dispatch\EventFlusher
        arguments:
            $buffer: '@ids_sensor.event_buffer'
            $identityProvider: '@ids_sensor.identity_provider'
            $normalizers: !tagged_iterator ids_sensor.event_normalizer
            $frameDispatcher: '@ids_sensor.frame_dispatcher'
            $counters: '@ids_sensor.counters'
            $deferredCounters: '@ids_sensor.deferred_counters'
            $latencyRecorder: '@ids_sensor.latency_recorder'
            $sampler: '@ids_sensor.sampler'

    # Flush auf kernel.terminate — NACH dem Absenden der Antwort. Zusätzlich auf
    # console.terminate und nach jeder Worker-Nachricht, weil dort kein terminate feuert.
    ids_sensor.flush_listener:
        class: ProjektMotor\IdsSensor\Delivery\Dispatch\FlushListener
        arguments:
            $flusher: '@ids_sensor.event_flusher'
            $heartbeat: '@?ids_sensor.heartbeat.emitter'
            # Konzept 4.: hartes Timeout von 50 ms fuer den Versand. Durchgesetzt wird es
            # zwischen Frame und Lebenszeichen — die einzige Naht, an der PHP eine Frist
            # ueberhaupt pruefen kann.
            $dispatchBudgetMs: '%ids_sensor.budget.dispatch_ms%'
